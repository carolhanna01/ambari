      description: '<p>Introduce a query parameter to control if smoke tests need
        to be run.</p>


        <p>E.g.<br/>

        curl -i -X PUT -d ''{"ServiceInfo": {"state" : "STARTED"}}'' <a href="http://localhost:8080/api/v1/clusters/c1/services/HDFS?params/run_smoke_test=true"
        class="external-link" target="_blank" rel="nofollow noopener">http://localhost:8080/api/v1/clusters/c1/services/HDFS?params/run_smoke_test=true</a></p>


        <p>In current architecture all query parameters are parsed and stored as predicates.
        Query parameters must consist of two parts at least. So we can''t call query
        parameter just run_smoke_test, such a parameter will be refused. For "run
        smoke test" flag the full parameter name is "params/run_smoke_test".</p>'
