      description: "<p>This is specifically for the IOP *4.2.0 *to HDP migration</p>\n\
        \n<p>Start with an IOP 4.2.0 cluster with both Oozie and Knox installed, enable\
        \ Kerberos then run thru the migration. Once EU is finalized, regen Kerberos\
        \ keytabs via Ambari web UI and check the checkbox to make Ambari restart\
        \ all services as part of the regen process.</p>\n\n<p>Notice Oozie crashes\
        \ after a successful restart with following error in the oozie.log file</p>\n\
        <div class=\"preformatted panel\" style=\"border-width: 1px;\"><div class=\"\
        preformattedContent panelContent\">\n<pre>2017-08-23 12:39:48,480 FATAL Services:514\
        \ - SERVER[umiak2.fyre.ibm.com] E0550: Could not normalize host name [${host}],\
        \ Could not resolve host [${host}], ${host}: Name or service not known \n\
        org.apache.oozie.service.ServiceException: E0550: Could not normalize host\
        \ name [${host}], Could not resolve host [${host}], ${host}: Name or service\
        \ not known\n</pre>\n</div></div>\n<p>This is because Knox kerberos.json in\
        \ IOP 4.2.0 has oozie proxy setting as <br/>\n<tt>\"oozie.service.ProxyUserService.proxyuser.knox.hosts\"\
        : \"${hosts}\",</tt></p>\n\n<p>In HDP 2.6.2, the same property  is now <br/>\n\
        <tt>\"oozie.service.ProxyUserService.proxyuser.${knox-env/knox_user}.hosts\"\
        : \"${clusterHostInfo/knox_gateway_hosts}\"</tt>, where the ${hosts} placeholder\
        \ is changed and Knox params.py no longer has the logic to calculate it .</p>\n\
        \n<p><b>A manual fix</b> is to change Kerboers config for Knox - update <tt>\"\
        oozie.service.ProxyUserService.proxyuser.knox.hosts\"</tt> to have value <tt>\"\
        ${clusterHostInfo/knox_gateway_hosts}\"</tt>  ( done via UI, this will kick\
        \ off regen keytabs and restart services)</p>"
