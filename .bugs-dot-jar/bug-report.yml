      description: '<p>When a cluster is being created initially, there are many new
        alert instances being generated concurrently. This can lead to a race condition
        where certain alert types, such as aggregate alerts, fire several events and
        end up creating duplicate alert instances.</p>


        <p>Although aggregate alerts are the most common, the flaw is in the alert
        listener since it never guarantees uniqueness even though it supports concurrent
        events.</p>


        <p>This problem is mainly encountered when the cluster is initially created,
        and therefore a solution shouldn''t impact the rest of the cluster''s lifetime.
        In other words, we shouldn''t cause a degradation the other 99.9% of the time
        in order to fix this problem.</p>'
