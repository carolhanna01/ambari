      description: <p>Currently, there is no hand-shake between the server, agents,
        and the db to ensure that they are of compatible version. This is a risk as
        its expected to fail-fast if there are mismatches than discover it as a side
        effect of error due to incompatibility. Need to add the ability to have server
        reject registrations from agents that are incompatible as well as failfast
        if the database is not compatible.</p>
