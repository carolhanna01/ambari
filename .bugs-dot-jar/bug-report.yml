      description: "<p>NPE when migrating users table during upgrade to Ambari 2.7.0\
        \ with Oracle DB:</p>\n<div class=\"preformatted panel\" style=\"border-width:\
        \ 1px;\"><div class=\"preformattedContent panelContent\">\n<pre>2018-08-20\
        \ 11:36:46,395 ERROR [main] SchemaUpgradeHelper:207 - Upgrade failed. \njava.lang.NullPointerException\n\
        \tat org.apache.ambari.server.upgrade.UpgradeCatalog270.convertUserCreationTimeToLong(UpgradeCatalog270.java:595)\n\
        \tat org.apache.ambari.server.upgrade.UpgradeCatalog270.upgradeUserTables(UpgradeCatalog270.java:342)\n\
        \tat org.apache.ambari.server.upgrade.UpgradeCatalog270.executeDDLUpdates(UpgradeCatalog270.java:318)\n\
        \tat org.apache.ambari.server.upgrade.AbstractUpgradeCatalog.upgradeSchema(AbstractUpgradeCatalog.java:970)\n\
        \tat org.apache.ambari.server.upgrade.SchemaUpgradeHelper.executeUpgrade(SchemaUpgradeHelper.java:205)\n\
        \tat org.apache.ambari.server.upgrade.SchemaUpgradeHelper.main(SchemaUpgradeHelper.java:448)\n\
        2018-08-20 11:36:46,395 ERROR [main] SchemaUpgradeHelper:473 - Exception occurred\
        \ during upgrade, failed\norg.apache.ambari.server.AmbariException\n\tat org.apache.ambari.server.upgrade.SchemaUpgradeHelper.executeUpgrade(SchemaUpgradeHelper.java:208)\n\
        \tat org.apache.ambari.server.upgrade.SchemaUpgradeHelper.main(SchemaUpgradeHelper.java:448)\n\
        Caused by: java.lang.NullPointerException\n\tat org.apache.ambari.server.upgrade.UpgradeCatalog270.convertUserCreationTimeToLong(UpgradeCatalog270.java:595)\n\
        \tat org.apache.ambari.server.upgrade.UpgradeCatalog270.upgradeUserTables(UpgradeCatalog270.java:342)\n\
        \tat org.apache.ambari.server.upgrade.UpgradeCatalog270.executeDDLUpdates(UpgradeCatalog270.java:318)\n\
        \tat org.apache.ambari.server.upgrade.AbstractUpgradeCatalog.upgradeSchema(AbstractUpgradeCatalog.java:970)\n\
        \tat org.apache.ambari.server.upgrade.SchemaUpgradeHelper.executeUpgrade(SchemaUpgradeHelper.java:205)\n\
        \t... 1 more\n</pre>\n</div></div>\n<p><b>Cause</b><br/>\nThis is caused by\
        \ one or more records with a\_<tt>NULL</tt>\_value in the\_<tt>create_time</tt>\_\
        field.</p>\n\n<p>For example:</p>\n<div class='table-wrap'>\n<table class='confluenceTable'><tbody>\n\
        <tr>\n<th class='confluenceTh'>user_id</th>\n<th class='confluenceTh'>user_name</th>\n\
        <th class='confluenceTh'>user_type</th>\n<th class='confluenceTh'>create_time</th>\n\
        </tr>\n<tr>\n<td class='confluenceTd'>1</td>\n<td class='confluenceTd'>admin</td>\n\
        <td class='confluenceTd'>LOCAL</td>\n<td class='confluenceTd'>NULL</td>\n\
        </tr>\n</tbody></table>\n</div>\n\n\n<p><b>Workaround</b>\_<br/>\nUpdate the\
        \ relevant records to not have a\_<tt>NULL</tt>\_in the\_<tt>create_time</tt>\_\
        column.</p>\n\n<p>For example:</p>\n<div class=\"preformatted panel\" style=\"\
        border-width: 1px;\"><div class=\"preformattedContent panelContent\">\n<pre>UPDATE\
        \ users SET create_time=systimestamp WHERE create_time IS NULL;\n</pre>\n\
        </div></div>\n<p><b>Solution</b><br/>\nDuring upgrade, protect against a\_\
        <tt>null</tt>\_value for\_<tt>currentUserCreateTime.getValue()</tt>\_at:</p>\n\
        <div class=\"code panel\" style=\"border-width: 1px;\"><div class=\"codeHeader\
        \ panelHeader\" style=\"border-bottom-width: 1px;\"><b>org/apache/ambari/server/upgrade/UpgradeCatalog270.java:595</b></div><div\
        \ class=\"codeContent panelContent\">\n<pre class=\"code-java\">\n       \
        \   dbAccessor.updateTable(USERS_TABLE, temporaryColumnName, currentUserCreateTime.getValue().getTime(),\n\
        \              <span class=\"code-quote\">\"WHERE \"</span> + USERS_USER_ID_COLUMN\
        \ + <span class=\"code-quote\">\"=\"</span> + currentUserCreateTime.getKey());\n\
        </pre>\n</div></div>\n<p>If\_<tt>currentUserCreateTime.getValue()</tt>\_is\
        \ null, the current timestamp should be used.</p>\n\n<p><b>Note:</b>\_This\
        \ may be a reoccurring issue since there is no provision to ensure that\_\
        <tt>create_time</tt>\_is not\_<tt>NULL</tt>\_when initializing the Ambari\
        \ database:</p>\n<div class=\"code panel\" style=\"border-width: 1px;\"><div\
        \ class=\"codeContent panelContent\">\n<pre class=\"code-java\">\ninsert into\
        \ users(user_id, principal_id, user_name, user_password)\nselect 1,1,<span\
        \ class=\"code-quote\">'admin'</span>,<span class=\"code-quote\">'538916f8943ec225d97a9a86a2c6ec0818c1cd400e09e03b660fdaaec4af29ddbb6f2b1033b81b00'</span>\
        \ from dual;</pre>\n</div></div>"
