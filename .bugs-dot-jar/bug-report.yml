      description: <p>In some cases the methods getFullProperties() and getFullAttributes()
        in the Configuration class modify the underlying configuration.  In one path,
        a deep copy isn't being properly done on the configuration maps so the underlying
        map is being modified.  This can cause a host group configuration to be set
        on the cluster scoped configuration.</p>
