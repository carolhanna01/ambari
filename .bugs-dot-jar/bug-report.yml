      description: "<p>The Ambari LogSearch integration layer is currently creating\
        \ too many repeated error log messages in ambari-server.log when a connection\
        \ attempt fails.</p>\n\n<p>Hundreds of instances of the following log message:</p>\n\
        \n<div class=\"code panel\" style=\"border-width: 1px;\"><div class=\"codeContent\
        \ panelContent\">\n<pre class=\"code-java\">2016-04-20 14:57:13,000 ERROR\
        \ qtp-ambari-client-324 LoggingSearchPropertyProvider - Error occurred <span\
        \ class=\"code-keyword\">while</span> making request to LogSearch service,\
        \ unable to populate logging properties on <span class=\"code-keyword\">this</span>\
        \ resource \n</pre>\n</div></div>\n\n<p>appear when a connection attempt to\
        \ the LogSearch service fails.</p>\n\n<p>This problem can occur when:</p>\n\
        \n<p>1. The LogSearch service crashes or is unexpectedly brought down<br/>\n\
        2. There is a lag time during which a crashed service is still considered\
        \ to be in the STARTED state, which is the state checked by the LoggingSearchPropertyProvider\
        \ to determine if a connection should be attempted.  <br/>\n3. This causes\
        \ the LogSearch integration code to log many connection attempt failures un-necessarily,\
        \ since only one instance of this message is necessary. </p>\n\n<p>The LogSearch\
        \ integration code should use a static counter to determine how many times\
        \ a given error log should appear.  </p>\n\n<p>I'm working on a fix for this,\
        \ and will submit a patch shortly. </p>"
