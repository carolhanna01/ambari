      description: '<p>Using AmbariStreamProvider with a query string but it''s encoding
        the ?.</p>


        <p>Believe this might need to change slight to account for people who want
        to pass in a path with a query string.</p>


        <p><a href="https://github.com/apache/ambari/blob/trunk/ambari-server/src/main/java/org/apache/ambari/server/view/ViewAmbariStreamProvider.java#L104"
        class="external-link" target="_blank" rel="nofollow noopener">https://github.com/apache/ambari/blob/trunk/ambari-server/src/main/java/org/apache/ambari/server/view/ViewAmbariStreamProvider.java#L104</a></p>


        <p>Because the controller getAmbariServerURI uses URIBuilder, which might
        encode the path.</p>'
