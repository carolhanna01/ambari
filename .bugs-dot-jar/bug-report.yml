      description: "<p><b>Steps:</b></p>\n<ol>\n\t<li>Try EU from HDP 2.1 to 2.3.4\
        \ on an unsecure and non-HA cluster</li>\n\t<li>Let the EU succeed</li>\n\t\
        <li>Enable security on the cluster</li>\n</ol>\n\n\n<p>Result:<br/>\nAfter\
        \ enabling security HiveServer2 goes down</p>\n\n<p>Looked at the value of\
        \ three properties:<br/>\nhive.cluster.delegation.token.store.zookeeper.connectString\"\
        : \"localhost:2181\"<br/>\nhive.zookeeper.quorum\": \"localhost:2181\"<br/>\n\
        hive.cluster.delegation.token.store.class:org.apache.hadoop.hive.thrift.ZooKeeperTokenStore</p>\n\
        \n<p>It appears that values of first and second property are wrongly set (compared\
        \ this with a fresh non-HA cluster where Kerberos was enabled after install)</p>\n\
        \n\n<p>Logs on HiveServer node:</p>\n<div class=\"code panel\" style=\"border-width:\
        \ 1px;\"><div class=\"codeContent panelContent\">\n<pre class=\"code-java\"\
        >2015-12-14 17:41:48,495 FATAL [<span class=\"code-object\">Thread</span>-9]:\
        \ thrift.ThriftCLIService (ThriftBinaryCLIService.java:run(101)) - Error starting\
        \ HiveServer2: could not start ThriftBinaryCLIService\nveserorg.apache.hadoop.hive.thrift.DelegationTokenStore$TokenStoreException:\
        \ Error creating path /hive/cluster/delegationHIVESERVER2/keys\n        at\
        \ org.apache.hadoop.hive.thrift.ZooKeeperTokenStore.ensurePath(ZooKeeperTokenStore.java:166)\n\
        \        at org.apache.hadoop.hive.thrift.ZooKeeperTokenStore.initClientAndPaths(ZooKeeperTokenStore.java:236)\n\
        \        at org.apache.hadoop.hive.thrift.ZooKeeperTokenStore.init(ZooKeeperTokenStore.java:469)\n\
        \        at org.apache.hadoop.hive.thrift.HadoopThriftAuthBridge$Server.startDelegationTokenSecretManager(HadoopThriftAuthBridge.java:444)\n\
        \        at org.apache.hive.service.auth.HiveAuthFactory.&lt;init&gt;(HiveAuthFactory.java:124)\n\
        \        at org.apache.hive.service.cli.thrift.ThriftBinaryCLIService.run(ThriftBinaryCLIService.java:57)\n\
        \        at java.lang.<span class=\"code-object\">Thread</span>.run(<span\
        \ class=\"code-object\">Thread</span>.java:745)\nCaused by: org.apache.zookeeper.KeeperException$AuthFailedException:\
        \ KeeperErrorCode = AuthFailed <span class=\"code-keyword\">for</span> /hive/cluster/delegationHIVESERVER2/keys\n\
        \        at org.apache.zookeeper.KeeperException.create(KeeperException.java:123)\n\
        \        at org.apache.zookeeper.KeeperException.create(KeeperException.java:51)\n\
        \        at org.apache.zookeeper.ZooKeeper.create(ZooKeeper.java:783)\n  \
        \      at org.apache.curator.framework.imps.CreateBuilderImpl$11.call(CreateBuilderImpl.java:691)\n\
        \        at org.apache.curator.framework.imps.CreateBuilderImpl$11.call(CreateBuilderImpl.java:675)\n\
        \        at org.apache.curator.RetryLoop.callWithRetry(RetryLoop.java:107)\n\
        \        at org.apache.curator.framework.imps.CreateBuilderImpl.pathInForeground(CreateBuilderImpl.java:672)\n\
        \        at org.apache.curator.framework.imps.CreateBuilderImpl.protectedPathInForeground(CreateBuilderImpl.java:453)\n\
        \        at org.apache.curator.framework.imps.CreateBuilderImpl.forPath(CreateBuilderImpl.java:443)\n\
        \        at org.apache.curator.framework.imps.CreateBuilderImpl.forPath(CreateBuilderImpl.java:423)\n\
        \        at org.apache.curator.framework.imps.CreateBuilderImpl$3.forPath(CreateBuilderImpl.java:257)\n\
        \        at org.apache.curator.framework.imps.CreateBuilderImpl$3.forPath(CreateBuilderImpl.java:205)\n\
        \        at org.apache.hadoop.hive.thrift.ZooKeeperTokenStore.ensurePath(ZooKeeperTokenStore.java:160)\n\
        \        ... 6 more\n2015-12-14 17:41:48,497 INFO  [<span class=\"code-object\"\
        >Thread</span>-4]: server.HiveServer2 (HiveStringUtils.java:run(709)) - SHUTDOWN_MSG:\n\
        /************************************************************\nSHUTDOWN_MSG:\
        \ Shutting down HiveServer2 at os-r6-udmbts-baikaltom20unsecr-re-3.novalocal/172.22.76.200\n\
        ************************************************************/\n2015-12-14\
        \ 17:41:58,398 INFO  [main]: service.AbstractService (AbstractService.java:stop(125))\
        \ - Service:CLIService is stopped.\n2015-12-14 17:41:58,398 INFO  [main]:\
        \ service.AbstractService (AbstractService.java:stop(125)) - Service:HiveServer2\
        \ is stopped.\n2015-12-14 17:41:58,403 INFO  [main]: server.HiveServer2 (HiveServer2.java:removeServerInstanceFromZooKeeper(338))\
        \ - Server instance removed from ZooKeeper.\n2015-12-14 17:41:58,403 INFO\
        \  [<span class=\"code-object\">Thread</span>-7]: server.HiveServer2 (HiveServer2.java:stop(371))\
        \ - Shutting down HiveServer2\n2015-12-14 17:41:58,403 INFO  [<span class=\"\
        code-object\">Thread</span>-7]: server.HiveServer2 (HiveServer2.java:removeServerInstanceFromZooKeeper(338))\
        \ - Server instance removed from ZooKeeper.\n</pre>\n</div></div>\n\n<p>As\
        \ it turns out, the installation wizard sets these at Hive installation time,\
        \ even though they are only used for a Kerberized Hive. Therefore, the Kerberization\
        \ wizard doesn't set these at all.</p>\n\n<p>When upgrading from HDP 2.1 Hive,\
        \ the installation wizard hasn't set these since they first appeared in HDP\
        \ 2.2. Therefore, they are never set. The right way to fix this is to have\
        \ the Kerberos Wizard determine that it needs to calculate and set them. But\
        \ that's an architectural change mostly. The faster fix is to make Hive consistent\
        \ - just set them on upgrade from HDP 2.1</p>"
