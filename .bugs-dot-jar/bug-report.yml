      description: '<p>The modification is<br/>

        1) An unfiltered request for Request resources currently returns all ''IN_PROGRESS''
        requests. Change this behavior so that an unfiltered request will return the
        last 20 requests regardless of what the status is. This is still a bit of
        a hack but no worse than what we already have. It should be okay until pagination
        is done.<br/>

        2) To get the in progress requests we should do something like ''requests?Requests/request_status=IN_PROGRESS''.
        This is what we should have been doing all along.</p>'
