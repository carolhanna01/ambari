      description: "<p>Remove dependency on org.bouncycastle bcprov-jdk15on before\
        \ version 1.6.0 for Ambari Server security concerns. See </p>\n<ul>\n\t<li>CVE-2018-1000180\
        \ - <a href=\"https://nvd.nist.gov/vuln/detail/CVE-2018-1000180\" class=\"\
        external-link\" target=\"_blank\" rel=\"nofollow noopener\">https://nvd.nist.gov/vuln/detail/CVE-2018-1000180</a></li>\n\
        </ul>\n\n\n<p>This dependency is compiled into the apacheds-all.jar from </p>\n\
        \n<div class=\"code panel\" style=\"border-width: 1px;\"><div class=\"codeContent\
        \ panelContent\">\n<pre class=\"code-java\">\n    &lt;dependency&gt;\n   \
        \   &lt;groupId&gt;org.apache.directory.server&lt;/groupId&gt;\n      &lt;artifactId&gt;apacheds-all&lt;/artifactId&gt;\n\
        \      &lt;version&gt;2.0.0-M24&lt;/version&gt;\n    &lt;/dependency&gt;\n\
        </pre>\n</div></div>\n\n<p>The relevant parts of this need to be broken out\
        \ and the offending bouncy castle JAR needs to be excluded as needed. </p>"
