      description: "<p>So here's where we are:</p>\n\n<ul class=\"alternate\" type=\"\
        square\">\n\t<li><a href=\"https://reviews.apache.org/r/45890/diff/2#index_header\"\
        \ class=\"external-link\" target=\"_blank\" rel=\"nofollow noopener\">https://reviews.apache.org/r/45890/diff/2#index_header</a>\
        \ removed hard-coded python code which was trying to figure out which coprocessor\
        \ to use. With these values gone, it's now up to Ambari to set the <em>right</em>\
        \ value in the configurations.</li>\n</ul>\n\n\n<ul class=\"alternate\" type=\"\
        square\">\n\t<li>However, after removing the above code, we never change the\
        \ ranger configurations to reflect the proper value</li>\n</ul>\n\n\n<ul class=\"\
        alternate\" type=\"square\">\n\t<li>To fix this, we need to fix the values\
        \ on Ambari upgrade. When upgrading Ambari from 2.0, we'll need to do the\
        \ following:\n\t<ul class=\"alternate\" type=\"square\">\n\t\t<li>If Ranger\
        \ is disabled; do nothing</li>\n\t\t<li>If Ranger is enabled and the cluster's\
        \ current stack is HDP 2.2, then set the master/region coprocessors to\n<div\
        \ class=\"code panel\" style=\"border-width: 1px;\"><div class=\"codeContent\
        \ panelContent\">\n<pre class=\"code-java\">hbase_coprocessor_master_classes\
        \ = <span class=\"code-quote\">\"com.xasecure.authorization.hbase.XaSecureAuthorizationCoprocessor\"\
        </span>\nhbase_coprocessor_regionserver_classes = <span class=\"code-quote\"\
        >\"com.xasecure.authorization.hbase.XaSecureAuthorizationCoprocessor\"</span>\n\
        hbase_coprocessor_region_classes = <span class=\"code-quote\">\"org.apache.hadoop.hbase.security.token.TokenProvider,org.apache.hadoop.hbase.security.access.SecureBulkLoadEndpoint,com.xasecure.authorization.hbase.XaSecureAuthorizationCoprocessor\"\
        </span>\n</pre>\n</div></div></li>\n\t\t<li>If Ranger is enabled and the cluster's\
        \ current stack is HDP 2.3, then set the master/region coprocessors to\n<div\
        \ class=\"code panel\" style=\"border-width: 1px;\"><div class=\"codeContent\
        \ panelContent\">\n<pre class=\"code-java\">hbase_coprocessor_master_classes\
        \ = <span class=\"code-quote\">\"org.apache.ranger.authorization.hbase.RangerAuthorizationCoprocessor\
        \ \"</span>\nhbase_coprocessor_regionserver_classes = <span class=\"code-quote\"\
        >\"org.apache.ranger.authorization.hbase.RangerAuthorizationCoprocessor\"\
        </span>\nhbase_coprocessor_region_classes = <span class=\"code-quote\">\"\
        org.apache.hadoop.hbase.security.token.TokenProvider,org.apache.hadoop.hbase.security.access.SecureBulkLoadEndpoint,org.apache.ranger.authorization.hbase.RangerAuthorizationCoprocessor\"\
        </span>\n</pre>\n</div></div></li>\n\t</ul>\n\t</li>\n</ul>\n\n\n<p>Now HDP\
        \ stack upgrades will work since we look for <tt>XaSecureAuthorizationCoprocessor</tt>\
        \ and change it to <tt>RangerAuthorizationCoprocessor</tt> as needed.</p>"
