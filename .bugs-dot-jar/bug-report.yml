      description: "<p>1) create a read-only user<br/>\n2) login, go to configs<br/>\n\
        3) you are presented with an error and page reloads.</p>\n\n<p>I have two\
        \ local only users: \u201Cadmin\u201D, and \u201Csree\u201D. Sree has \u201C\
        Read-Only\u201D permissions for the cluster. However, as you can see from\
        \ the screenshots, that user gets errors when trying to view any service configurations.\
        \ The error flashes on screen for roughly a second before the page force reloads\
        \ to the dashboard.</p>"
