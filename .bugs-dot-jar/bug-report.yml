      description: '<p>The LogSearch integration layer in Ambari is passing incorrect
        query parameters to the LogSearch Server.  Recent multi-node testing has uncovered
        this issue. </p>


        <p>The LogSearch integration code should use "host_name" for specifying hosts
        in query URLs, and "component_name" for specifying the component for a given
        LogSearch query.  The "component_name" change is related to a change in the
        parameters for LogSearch itself, which used to use "components_name".  </p>


        <p>The integration code should be updated to use these query parameter names.  </p>


        <p>I''m working on a fix for this, and will be submitting a patch shortly.
        </p>'
