      description: <p>If agent restarts prior to sending a response to START/STOP
        command request (after successful start/stop at the host) then the state of
        the host component may not transition out of STARTING/STOPPING. When the agent
        restarts it will start sending heart-beat with the correct component state
        as STARTED/INSTALLED which will not be processed by the server. Heartbeat
        handler should reflect the state based on the heart-beat.</p>
