      description: "<p>Installing a new cluster can create values in yarn-site.xml\
        \ which have <tt>None</tt> specified in the classpath for Spark</p>\n\n<div\
        \ class=\"code panel\" style=\"border-width: 1px;\"><div class=\"codeContent\
        \ panelContent\">\n<pre class=\"code-java\">\n&lt;property&gt;\n      &lt;name&gt;yarn.nodemanager.aux-services.spark2_shuffle.classpath&lt;/name&gt;\n\
        \      &lt;value&gt;/usr/hdp/None/spark2/aux/*&lt;/value&gt;\n    &lt;/property&gt;\n\
        \n &lt;property&gt;\n      &lt;name&gt;yarn.nodemanager.aux-services.spark_shuffle.classpath&lt;/name&gt;\n\
        \      &lt;value&gt;/usr/hdp/None/spark/aux/*&lt;/value&gt;\n    &lt;/property&gt;\n\
        \n&lt;property&gt;\n      &lt;name&gt;yarn.timeline-service.entity-group-fs-store.group-id-plugin-classpath&lt;/name&gt;\n\
        \      &lt;value&gt;/usr/hdp/None/spark/hdpLib/*&lt;/value&gt;\n    &lt;/property&gt;\n\
        </pre>\n</div></div>\n\n<p>The cause for this is that YARN Clients on hosts\
        \ without daemons never get a restart command after the initial <tt>yarn-site.xml</tt>,\
        \ and can never fill in the correct values. This causes problems when jobs\
        \ are run on these nodes:</p>\n\n<div class=\"code panel\" style=\"border-width:\
        \ 1px;\"><div class=\"codeContent panelContent\">\n<pre class=\"code-java\"\
        >\n2017-12-04 10:16:41,789 INFO  service.AbstractService (AbstractService.java:noteFailure(272))\
        \ - Service org.apache.hadoop.yarn.server.nodemanager.containermanager.AuxServices\
        \ failed in state INITED; cause: java.lang.ClassNotFoundException: org.apache.spark.network.yarn.YarnShuffleService\n\
        java.lang.ClassNotFoundException: org.apache.spark.network.yarn.YarnShuffleService\n\
        </pre>\n</div></div>"
